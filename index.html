<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Design</title>
<link rel="stylesheet" href="style.css">
  


</head>
<body>

<div class="calculator">
    <div class="display">0</div>
    
    <table>
        <tr>
            <td><button class="clear">AC</button></td>
            <td><button class="del">DEL</button></td>
            <td><button class="operator">÷</button></td>
            <td><button class="operator">x</button></td>
        </tr>
        <tr>
            <td><button>7</button></td>
            <td><button>8</button></td>
            <td><button>9</button></td>
            <td><button class="operator">-</button></td>
        </tr>
        <tr>
            <td><button>4</button></td>
            <td><button>5</button></td>
            <td><button>6</button></td>
            <td><button class="operator">+</button></td>
        </tr>
        <tr>
            <td><button>1</button></td>
            <td><button>2</button></td>
            <td><button>3</button></td>
            <td rowspan="2"><button class="equal equal-btn">=</button></td>
        </tr>
        <tr>
            <td colspan="2"><button class="zero-btn">0</button></td>
            <td><button>.</button></td>
        </tr>
    </table>
</div>

</body>
</html>
